[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--cov=clinica --cov=main --cov=index --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]  # assert é o jeito normal de escrever testes com pytest

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # senhas falsas usadas só nos testes
