AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Agenda Online da clinica de psicologia infantil. Cria a aplicacao (Lambda + API HTTP),
  o banco (DynamoDB), as permissoes, a ligacao segura com o GitHub e o monitoramento.
  Tudo dimensionado para o plano gratuito da AWS.

Parameters:
  GitHubRepo:
    Type: String
    Description: Repositorio no formato usuario/repositorio. So o branch main dele pode publicar.
  ClinicaNome:
    Type: String
    Description: Nome da clinica que aparece no site.
  ClinicaCidade:
    Type: String
    Default: "Poços de Caldas, MG"
  AdminUser:
    Type: String
    Default: admin
    Description: Usuario do painel da clinica.
  EmailAlertas:
    Type: String
    Description: E-mail que recebe os alarmes (confirme a inscricao no e-mail que a AWS enviar).
  CriarProvedorGitHub:
    Type: String
    Default: "sim"
    AllowedValues: ["sim", "nao"]
    Description: Use "nao" se a conta ja tiver o provedor OIDC do GitHub cadastrado no IAM.

Conditions:
  CriarOIDC: !Equals [!Ref CriarProvedorGitHub, "sim"]

Resources:
  # ------------------------------------------------------------ banco de dados (PaaS)
  # Capacidade provisionada de 5/5 fica dentro do uso sempre gratuito do DynamoDB (25/25).
  Tabela:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: agenda-solicitacoes
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: projeto, Value: agenda-clinica }

  # ------------------------------------------------------------ permissões da aplicação
  # A aplicação só pode: gravar logs, usar a tabela e ler os 2 parâmetros secretos.
  FuncaoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: agenda-clinica-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: acesso-minimo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:DescribeTable
                Resource: !GetAtt Tabela.Arn
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agenda-clinica/*

  # ------------------------------------------------------------ aplicação (PaaS/serverless)
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/agenda-clinica
      RetentionInDays: 14

  Funcao:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: agenda-clinica
      Description: Agenda Online da clinica (Flask)
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FuncaoRole.Arn
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          ARMAZENAMENTO: dynamodb
          TABELA: !Ref Tabela
          SSM_PREFIXO: /agenda-clinica/
          CLINICA_NOME: !Ref ClinicaNome
          CLINICA_CIDADE: !Ref ClinicaCidade
          ADMIN_USER: !Ref AdminUser
      # Código provisório: o pipeline do GitHub substitui pelo da aplicação na primeira publicação.
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200, "headers": {"content-type": "text/plain; charset=utf-8"},
                      "body": "Aguardando a primeira publicacao pelo GitHub Actions."}
      Tags:
        - { Key: projeto, Value: agenda-clinica }

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: agenda-clinica
      ProtocolType: HTTP
      Description: Recebe as requisicoes HTTPS e entrega para a Lambda
      Target: !GetAtt Funcao.Arn # cria a rota padrão e o estágio $default
      Tags:
        projeto: agenda-clinica

  ApiPodeChamarFuncao:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Funcao
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # ------------------------------------------------------------ publicação pelo GitHub (sem chave)
  ProvedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CriarOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4d2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: agenda-clinica-github-deploy
      Description: Usada pelo GitHub Actions. So publica o codigo da funcao agenda-clinica.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Só o branch main do repositório do projeto. O GitHub pode mandar o nome
              # simples (usuario/repo) ou com o número de identificação (usuario@123/repo@456).
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub
                    - repo:${Dono}@*/${Repo}@*:ref:refs/heads/main
                    - Dono: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Repo: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: publicar-funcao
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: !GetAtt Funcao.Arn

  # ------------------------------------------------------------ monitoramento (dentro do gratuito: 10 alarmes, 3 painéis)
  TopicoAlertas:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: agenda-clinica-alertas
      Subscription:
        - Protocol: email
          Endpoint: !Ref EmailAlertas

  AlarmeErrosAplicacao:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agenda-clinica-erros-5xx
      AlarmDescription: Mais de 5 respostas 5xx em 5 minutos.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref Api }
        - { Name: Stage, Value: $default }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoAlertas]

  AlarmeLentidao:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agenda-clinica-lentidao
      AlarmDescription: Tempo de resposta (p95) acima de 1 segundo por 5 minutos.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - { Name: ApiId, Value: !Ref Api }
        - { Name: Stage, Value: $default }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoAlertas]

  AlarmeFalhasFuncao:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agenda-clinica-falhas-lambda
      AlarmDescription: A funcao falhou ou foi limitada (throttle) nos ultimos 5 minutos.
      Metrics:
        - Id: falhas
          Expression: erros + limitadas
          Label: Erros + limitacoes da Lambda
        - Id: erros
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref Funcao }]
            Period: 300
            Stat: Sum
        - Id: limitadas
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions: [{ Name: FunctionName, Value: !Ref Funcao }]
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TopicoAlertas]

  Painel:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: agenda-clinica
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "Requisicoes e erros", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
              "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${Api}", "Stage", "$default"],
                          [".", "4xx", ".", ".", ".", "."], [".", "5xx", ".", ".", ".", "."]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "Tempo de resposta (ms)", "region": "${AWS::Region}", "period": 60,
              "metrics": [["AWS/ApiGateway", "Latency", "ApiId", "${Api}", "Stage", "$default", {"stat": "p50"}],
                          ["...", {"stat": "p95"}]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Execucoes simultaneas (escala)", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
              "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${Funcao}"]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Lambda: invocacoes, erros e limitacoes", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
              "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${Funcao}"],
                          [".", "Errors", ".", "."], [".", "Throttles", ".", "."]]}}
          ]
        }

Outputs:
  # Valores para cadastrar como variáveis no GitHub (o nome da variável está na descrição)
  SiteUrl:
    Description: Endereco do site (variavel AWS_API_URL)
    Value: !GetAtt Api.ApiEndpoint
  Regiao:
    Description: Variavel AWS_REGION
    Value: !Ref AWS::Region
  DeployRoleArn:
    Description: Variavel AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  FuncaoLambda:
    Description: Variavel AWS_LAMBDA_FUNCTION
    Value: !Ref Funcao